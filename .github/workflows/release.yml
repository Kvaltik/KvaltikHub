name: Vydat Kvaltik Hub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zkontrolovat verzi
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Git tag v$tag neodpovida package.json verzi $pkg"
            exit 1
          }

      - name: Nainstalovat zavislosti
        run: npm ci

      - name: Vytvorit Windows aktualizaci
        run: npm run release:build

      - name: Overit vystupni soubory
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $required = @(
            "dist\Kvaltik-Hub-Setup-$version-x64.exe",
            "dist\Kvaltik-Hub-Setup-$version-x64.exe.blockmap",
            "dist\latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              Write-Error "Chybi vystupni soubor: $file"
              exit 1
            }
          }

      - name: Vytvorit GitHub Release a nahrat aktualizaci
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "dist\Kvaltik-Hub-Setup-$version-x64.exe" `
            "dist\Kvaltik-Hub-Setup-$version-x64.exe.blockmap" `
            "dist\latest.yml" `
            --title "Kvaltik Hub $version" `
            --notes-file "RELEASE_NOTES_$version.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
